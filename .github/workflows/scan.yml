name: Scan (manual, for debugging verification failures)

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scan (beta, matching n8n Creator Portal's exact command)
        run: npx --yes @n8n/scan-community-package@beta n8n-nodes-getmulticast
