name: Build, scan, and publish to npm

# Real requirement, not a formality: n8n's own verification guidelines
# say "packages should be published from a GitHub Action and include
# provenance" — n8n won't accept a verified node published from a local
# machine's `npm publish`. This workflow is that required path.
#
# Triggered by pushing a version tag (e.g. v1.4.0) that matches the
# version already bumped in package.json — deliberate manual step
# (tag, don't auto-publish on every push to main) so a publish is
# always an explicit decision.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Scan with n8n's official community-package scanner
        run: npx --yes @n8n/scan-community-package n8n-nodes-getmulticast

      - name: Publish to npm (with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
